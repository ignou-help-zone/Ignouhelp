<!DOCTYPE html>
<html lang="en">
<head>
<title>IGNOU Percentage Calculator 2026 | 30% Assignment + 70% TEE Formula</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calculate IGNOU Final Percentage using 30% Assignment + 70% TEE formula. Download PDF and Share Result on WhatsApp.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    /* Same CSS as index.html */
    body {font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5;}
    header {background: #004080; color: white; text-align: center; padding: 15px 10px;}
   .logo {display: flex; align-items: center; justify-content: center; gap: 10px;}
    header img {width: 50px; height: 50px; background: white; border-radius: 50%; padding: 5px;}
   .container {max-width: 1100px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px;}
    nav {text-align: center; padding: 10px; background: #e6f0ff; position: sticky; top: 0;}
    nav a {margin: 0 10px; text-decoration: none; color: #004080; font-weight: bold;}
   .table-container {overflow-x: auto;}
    table {border-collapse: collapse; width: 100%;}
    th {background: #004080; color: white; padding: 12px 8px;}
    td {padding: 8px; text-align: center; border-bottom: 1px solid #eee;}
    input {width: 90px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center;}
    button {padding: 10px 15px; margin: 5px; border: none; background: #004080; color: white; border-radius: 5px; cursor: pointer; font-weight: bold;}
    button.green {background: #28a745;} button.orange {background: #ff6600;}
    #gradeResult {margin-top: 15px; padding: 15px; background: #e6ffe6; border-left: 4px solid green; border-radius: 5px;}
    footer {background: #222; color: white; text-align: center; padding: 15px; margin-top: 20px;}
</style>
</head>
<body>
<header><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/en/thumb/1/15/IGNOU_logo.svg/1200px-IGNOU_logo.svg.png"><div><h1>🎓 IGNOU Help Portal</h1></div></div></header>

<nav>
<a href="index.html">🏠 Home</a> |
<a href="assignment.html">📚 Assignments</a> |
<a href="calculator.html">🧮 Calculator</a> |
<a href="result.html">📊 Result</a>
</nav>

<div class="container">
<h2>📊 Grade Card Calculator</h2>
<p>Calculate <b>30% Assignment + 70% TEE = Final Percentage</b> for all subjects</p>

<div class="table-container">
<table id="gradeTable">
<tr><th>Course Code</th><th>Assignment Marks<br><small>Out of 100</small></th><th>TEE Marks<br><small>Out of 100</small></th><th>Subject %</th></tr>
</table>
</div>

<br>
<button onclick="addRow()">➕ Add Row</button>
<button onclick="deleteRow()">➖ Delete Row</button>
<button onclick="calculateGradeCard()">📊 Calculate Overall</button>
<button onclick="resetTable()">🔄 Reset</button>
<button class="green" onclick="downloadPDF()">📄 Download PDF</button>

<div id="pdfArea"><h3 id="gradeResult"></h3></div>
<button class="orange" onclick="shareResult()">📤 Share Result on WhatsApp</button>
</div>

<footer><p>© 2026 IGNOU Help Portal</p></footer>

<script>
let calculatedOverall = 0;
function createRow() {let table = document.getElementById("gradeTable"); let row = table.insertRow(-1); row.innerHTML = `<td><input type="text" class="course" placeholder="BCS-011"></td><td><input type="number" class="assignmentMarks" min="0" max="100" oninput="calcRow(this)"></td><td><input type="number" class="teeMarks" min="0" max="100" oninput="calcRow(this)"></td><td class="percentageCell">-</td>`;}
document.addEventListener("DOMContentLoaded", function() { for(let i=1; i<=12; i++) { createRow(); } });
function addRow() { createRow(); }
function deleteRow() { let table = document.getElementById("gradeTable"); if(table.rows.length > 2){ table.deleteRow(-1); } }
function calcRow(input) { let row = input.parentElement.parentElement; let a = Number(row.querySelector(".assignmentMarks").value); let t = Number(row.querySelector(".teeMarks").value); let per = (a * 0.30) + (t * 0.70); row.querySelector(".percentageCell").innerText = (a > 0 || t > 0)? per.toFixed(2) + "%" : "-"; }
function calculateGradeCard() {let assignments = document.querySelectorAll(".assignmentMarks"); let tees = document.querySelectorAll(".teeMarks"); let total = 0; let subjects = 0; for(let i=0;i<assignments.length;i++){ let a = Number(assignments[i].value); let t = Number(tees[i].value); if(a > 0 || t > 0){ total += (a * 0.30) + (t * 0.70); subjects++; } if(subjects === 0){document.getElementById("gradeResult").innerHTML = "⚠️ Please enter marks for at least one subject."; calculatedOverall = 0; return;} calculatedOverall = total / subjects; let division = calculatedOverall >= 75? "Distinction" : calculatedOverall >= 60? "First Division" : calculatedOverall >= 50? "Second Division" : "Third Division"; document.getElementById("gradeResult").innerHTML = `<b>Overall Percentage:</b> ${calculatedOverall.toFixed(2)}%<br><br><b>Division:</b> ${division}<br><br><b>Subjects Entered:</b> ${subjects}`;}
function resetTable() {calculatedOverall = 0; document.getElementById("gradeTable").innerHTML = `<tr><th>Course Code</th><th>Assignment Marks<br><small>Out of 100</small></th><th>TEE Marks<br><small>Out of 100</small></th><th>Subject %</th></tr>`; for(let i=1; i<=12; i++) { createRow(); } document.getElementById("gradeResult").innerHTML = "";}
function downloadPDF() {if(calculatedOverall === 0){alert("⚠️ Please Calculate Your Percentage First"); return;} const element = document.getElementById("pdfArea"); const opt = { margin: 0.5, filename: `IGNOU-GradeCard-${calculatedOverall.toFixed(2)}%.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } }; html2pdf().set(opt).from(element).save();}
function shareResult() {if(calculatedOverall === 0){alert("⚠️ Please Calculate Your Percentage First"); return;} let result = document.getElementById("gradeResult").innerText; let text = `My IGNOU Percentage: ${calculatedOverall.toFixed(2)}%\n` + result + `\n\nCalculate yours here:\nhttps://ignou-help-zone.github.io/Ignouhelp/calculator.html`; let whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`; window.open(whatsappUrl, '_blank');}
</script>
</body>
</html>
